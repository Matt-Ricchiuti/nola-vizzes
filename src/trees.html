<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Orleans Street Trees · Nola Vizzes</title>
<style>{{CSS}}
:root{--water:#c7d6dd;--t-land:#e6e8e1;--t-hood:#f5f6f1;--t-dim:#c9cfc8;--t-other:#aab3ad;--t-stump:#7d837f;
  --t-park:#dbe8d0;--t-park-line:#b5cba4;--t-wild:#e2eadb;--t-cem:#dfe2d8;--t-lot:#e9e7dc;--t-park-ink:#3d6a47}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme="light"])){--water:#0d1820;--t-land:#151e1d;--t-hood:#1c2826;--t-dim:#2c3836;--t-other:#55635d;--t-stump:#8d948f;
  --t-park:#1d3128;--t-park-line:#2d4a3a;--t-wild:#1b2b24;--t-cem:#232d29;--t-lot:#272a24;--t-park-ink:#93c29d}}
.tmap{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab;border-radius:12px}
.tmap.drag{cursor:grabbing}
/* no visible chart title: the switch on the map says which map it is (the heading stays for screen readers) */
.vbar.one h2{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
/* the share button sits beside the page title; the chart bar (only a hidden heading) takes no room */
.ptitle{display:flex;align-items:center;gap:10px;min-width:0}
.vbar.one{display:none}
.vbar.one+.vsec{margin-top:0}
/* the Trees / Tree requests switch floats at the top center of the map */
.ftabs.tmode{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:3;width:max-content;max-width:calc(100% - 120px);background:var(--surface);border:1px solid var(--ring);box-shadow:0 4px 14px rgb(0 0 0 / .14)}
.ftabs.tmode button{flex:0 0 auto;padding:6px 14px;white-space:nowrap}
.ftabs.tmode button[aria-selected="true"]{background:var(--ink);color:var(--surface);box-shadow:none}
.tstats{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.tstats .r{display:flex;justify-content:space-between;gap:12px}
.tstats .r span:last-child{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
.tstats .r span:first-child{color:var(--ink2)}
/* the map is the page: it runs from under the header to the bottom of the window (--tt set by trees.js) */
.tfill.stage.mapstage{height:max(460px,calc(100vh - var(--tt,0px) - var(--gut)))}
@media(max-width:760px){
  .tfill.stage.mapstage{height:auto}
  .tfill.stage.mapstage .plot{height:max(380px,calc(100vh - var(--tt,0px) - var(--gut)));height:max(380px,calc(100svh - var(--tt,0px) - var(--gut)))}
}
</style>
{{D3}}
</head><body><div class="wrap">
{{NAV}}
<div class="phead"><div class="ptitle"><h1>Street trees</h1></div>
<aside class="srcbox" aria-label="Data sources"><span class="sbl">Source data</span><span class="sbl r">Updated</span><a href="https://data.nola.gov/d/3tyj-9x33">Tree Location</a><a href="https://data.nola.gov/d/2jgv-pqrq">311 OPCD Calls (tree requests)</a><span class="thru">Requests through {{SR_THRU}}</span></aside></div>
<div id="chart"></div>
{{FOOT}}
</div>
<script>const DATA={{DATA}};</script>
<script>{{LIB}}</script>
<script>{{JS}}</script>
</body></html>
