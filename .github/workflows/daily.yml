# Every morning: check data.nola.gov for new data, rebuild what changed, commit, and publish.
# pipeline/fetch.py downloads a dataset only when the City has changed it, and rewrites a data file only
# when its content changed, so on a day without new data nothing is committed or deployed.
# If a dataset looks wrong (empty fetch, missing column, counts collapsing), that page keeps its last good
# version, the rest still publish, and the run ends failed. GitHub emails the repo owner when a scheduled
# run fails.
name: Daily data refresh

on:
  schedule:
    # The City loads CPC Projects around 06:00 UTC and Calls for Service around 09:00 UTC (3 a.m. Central).
    - cron: '30 10 * * *'   # 10:30 UTC = 4:30 a.m. Central (5:30 a.m. during daylight time)
  workflow_dispatch:         # "Run workflow" button on the Actions tab
    inputs:
      full:
        description: 'Download and rebuild everything, even datasets the City has not changed (ignores the saved downloads)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write   # only to keep the schedule switched on, see the last step of refresh

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      failed: ${{ steps.fetch.outputs.failed }}
      alerts: ${{ steps.fetch.outputs.alerts }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      # .cache/raw holds the saved copies of the big datasets updated incrementally (311, Calls for Service) and
      # the API answers of datasets the City hasn't changed (see fetch.py). Restored here, saved again below even
      # if a later step fails. GitHub drops a cache unused for 7 days; the daily run reads it every day. If it's ever
      # lost, the next run downloads everything once and warns; twice within a few days fails the run.
      - name: Restore saved downloads
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/raw
          key: raw-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: raw-
      - name: Fetch data and rebuild pages
        id: fetch
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          echo "Saved downloads restored from: ${{ steps.cache.outputs.cache-matched-key || 'nothing (first run, or the cache expired)' }}"
          python pipeline/fetch.py ${{ inputs.full && '--full' || '' }}
          du -sh .cache/raw || true
      - name: Save downloads for the next run
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .cache/raw
          key: raw-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit if anything changed
        id: commit
        run: |
          git add data site
          if git diff --cached --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Data refresh $(TZ=America/Chicago date +%F)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # GitHub switches off scheduled workflows after 60 days without commits. Data normally changes daily,
      # but if the City stops publishing, re-enabling the workflow before then keeps it running.
      - name: Keep the schedule switched on
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          idle=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit $idle days ago."
          if [ "$idle" -ge 45 ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily.yml/enable"
          fi

  # Pushes made by this workflow don't trigger pages.yml, so deploy here.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  # A dataset that failed kept its last good version while the rest published, or an alert fired (a dataset the
  # City stopped updating, or the saved downloads not surviving between runs). Fail the run now, so GitHub emails
  # the owner.
  report:
    needs: [refresh, deploy]
    if: always() && (needs.refresh.outputs.failed != '' || needs.refresh.outputs.alerts != '')
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ -n "${{ needs.refresh.outputs.failed }}" ]; then
            echo "::error::Not refreshed today (last good version still on the site): ${{ needs.refresh.outputs.failed }}. See the refresh job's log for why."
          fi
          if [ -n "${{ needs.refresh.outputs.alerts }}" ]; then
            echo "::error::${{ needs.refresh.outputs.alerts }} alert(s): see the red lines in the refresh job's log (a dataset the City stopped updating, or the saved downloads not kept between runs)."
          fi
          exit 1
