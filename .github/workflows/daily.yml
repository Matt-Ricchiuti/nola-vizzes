# Every morning: pull fresh data from data.nola.gov, rebuild the pages, commit, and publish.
# If anything looks wrong (empty fetch, missing column, counts collapsing), pipeline/fetch.py
# exits with an error, nothing is committed, and the site keeps its last good version.
# GitHub emails the repo owner when a scheduled run fails.
name: Daily data refresh

on:
  schedule:
    - cron: '30 10 * * *'   # 10:30 UTC = 4:30 a.m. Central (5:30 a.m. during daylight time)
  workflow_dispatch:         # "Run workflow" button on the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Fetch data and rebuild pages
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python pipeline/fetch.py
      - name: Commit if anything changed
        id: commit
        run: |
          git add data site
          if git diff --cached --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Data refresh $(TZ=America/Chicago date +%F)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Pushes made by this workflow don't trigger pages.yml, so deploy here.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
