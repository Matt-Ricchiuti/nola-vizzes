<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>City Planning Commission cases · Nola Vizzes</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Young+Serif&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10); --land:#efeee9; --landline:#d7d5cc;
  --road:rgba(11,11,11,.13); --road-major:rgba(11,11,11,.26); --road-fwy:rgba(11,11,11,.42);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --q1:#cde2fb; --q2:#9ec5f4; --q3:#6da7ec; --q4:#3987e5; --q5:#256abf; --q6:#184f95; --q7:#0d366b;
  --none:#d9d8d2; --accent:#2a78d6; --chip:#efeee9;
  --gut:24px; /* page side gutter (matches .wrap's padding) */
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10); --land:#232321; --landline:#3a3a37;
    --road:rgba(255,255,255,.12); --road-major:rgba(255,255,255,.24); --road-fwy:rgba(255,255,255,.40);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
    --q1:#0d366b; --q2:#104281; --q3:#184f95; --q4:#1c5cab; --q5:#2a78d6; --q6:#5598e7; --q7:#9ec5f4;
    --none:#2f2f2c; --accent:#3987e5; --chip:#262624;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5}
h1,.vsec-h h2,.cards h2{font-family:"Young Serif",Georgia,"Times New Roman",serif;font-weight:400}
.eyebrow,.flist .ct,.scalebar,.src,.tip .r span:last-child{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
a{color:var(--accent)}
.wrap{max-width:1120px;margin:0 auto;padding:28px 24px 64px}
.site{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:22px;border-bottom:1px solid var(--grid);padding-bottom:12px;margin-bottom:28px;position:relative;z-index:30}
.site b{font-size:13px;letter-spacing:.08em;text-transform:uppercase}
/* header: site name left, the "Visualizations" menu centered, About right (the nav spans the middle and right columns) */
.topnav{grid-column:2/4;display:grid;grid-template-columns:subgrid;align-items:center;font-size:13px}
.topnav .xlink{justify-self:end;color:var(--ink2);text-decoration:none}
.topnav .xlink.on{color:var(--ink);font-weight:600}
.dd{position:relative}
.ddbtn{font:inherit;font-size:13px;color:var(--ink2);background:none;border:0;padding:4px 0;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.ddbtn.on,.dd:hover .ddbtn,.dd.open .ddbtn{color:var(--ink)}
.ddbtn span{font-size:10px;transition:transform .15s}
.dd:hover .ddbtn span,.dd.open .ddbtn span{transform:rotate(180deg)}
.dd1{list-style:none;margin:0;padding:6px;background:var(--surface);border:1px solid var(--ring);border-radius:10px;box-shadow:0 10px 30px rgb(0 0 0 / .14);display:none}
.dd1{position:absolute;top:100%;left:50%;transform:translateX(-50%);min-width:230px;margin-top:6px}
.dd1::before{content:"";position:absolute;left:0;right:0;top:-10px;height:10px} /* hover bridge */
.dd:hover .dd1,.dd:focus-within .dd1,.dd.open .dd1{display:block}
.dd1 li{position:relative}
.dd1 a{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:7px 10px;border-radius:7px;color:var(--ink);text-decoration:none;white-space:nowrap}
.dd1 a.on{font-weight:600}
.dd1 a:hover,.dd1 a:focus-visible{background:var(--chip);outline:none}
@media(max-width:640px){
  .site{gap:8px}
  .dd{position:static}
  .dd1{left:0;right:0;transform:none;top:100%;min-width:0;max-height:75vh;overflow:auto}
}
h1{font-size:30px;line-height:1.15;margin:0 0 6px;letter-spacing:0}
h2{font-size:19px;margin:0 0 4px}
.src{font-size:11.5px;color:var(--muted);margin:0 0 22px}
/* a data page's title, with the box of its City datasets (and when the City last updated each) floated to its right */
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px 28px;margin:0 0 18px}
.phead h1{margin:2px 0 0}
.srcbox{flex:0 1 auto;max-width:380px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:16px;row-gap:1px;align-items:baseline;
  font-size:11.5px;line-height:1.45;padding:6px 11px 7px;border:1px solid var(--ring);border-radius:10px;background:var(--surface)}
.srcbox .sbl{font:600 9.5px/1.6 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.srcbox .sbl.r,.srcbox .upd{text-align:right}
.srcbox a{color:var(--ink2)}
.srcbox .upd{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--muted);white-space:nowrap}
@media(max-width:640px){.phead{flex-wrap:wrap}.srcbox{flex:1 1 100%;max-width:none}}
.src a{color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:18px}
.nbfocus{fill:none;stroke:var(--ink);stroke-width:2.4;vector-effect:non-scaling-stroke}
.nbsel{font-size:13px}
[hidden]{display:none!important}
.pane.mapp{padding:6px}
.popnote{color:var(--muted);font-size:12px}
.split{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
@media(max-width:860px){.split{grid-template-columns:1fr} h1{font-size:23px}}
@media(max-width:600px){.wrap{padding:20px 16px 48px} .card{padding:12px} :root{--gut:16px}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{border:1px solid var(--ring);background:var(--chip);color:var(--ink);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
select{font:inherit;font-size:13px;padding:4px 8px;border-radius:8px;border:1px solid var(--ring);background:var(--surface);color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin:6px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
svg{display:block;max-width:100%}
svg text{fill:var(--muted);font-size:11px;font-family:inherit}
.axis path,.axis line{stroke:var(--axis)}
.gridl line{stroke:var(--grid)}
.gridl path{display:none}
.map>svg{background:var(--surface);border-radius:10px;cursor:grab}
/* maps on touch screens: one finger scrolls the page, two fingers move the map (NOLA.map / trees.js handle those) */
.map>svg,.stage.mapstage .plot canvas{touch-action:pan-x pan-y}
.nbpath{fill:var(--land);stroke:var(--landline);stroke-width:.8;vector-effect:non-scaling-stroke}
.nbhover{fill:none;stroke:var(--ink);stroke-width:1.6;vector-effect:non-scaling-stroke}
/* NOLA.map layers over the base svg: the dot canvas, then outlines and street names (neither takes input) */
.map{position:relative}
.map>canvas.mapdots,.map>svg.maptop{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;background:none}
.dothot{fill:none;stroke:var(--ink);stroke-width:1.6;vector-effect:non-scaling-stroke}
.streets{pointer-events:none}
.st{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.st3{stroke:var(--road);stroke-width:.5}
.st2{stroke:var(--road-major);stroke-width:.9}
.st1{stroke:var(--road-major);stroke-width:.8}
.st0{stroke:var(--road-fwy);stroke-width:1.7}
/* shaded maps (map.setFill): streets in the surface color show over every shade, light or dark */
svg.shaded .st3{stroke:color-mix(in srgb,var(--surface) 45%,transparent)}
svg.shaded .st2,svg.shaded .st1{stroke:color-mix(in srgb,var(--surface) 70%,transparent)}
svg.shaded .st0{stroke:color-mix(in srgb,var(--surface) 85%,transparent)}
.tip{position:fixed;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--ring);box-shadow:0 6px 24px rgba(0,0,0,.14);border-radius:10px;padding:9px 11px;font-size:12.5px;max-width:300px;z-index:20;opacity:0;transition:opacity .08s}
.tip b{font-size:13px}
.tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--ink2)}
.tip .r span:last-child{color:var(--ink);font-variant-numeric:tabular-nums}
.tip .more{color:var(--ink2);margin-top:4px;padding-top:4px;border-top:1px solid var(--grid)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;text-align:left;color:var(--ink2);border-bottom:1px solid var(--axis);padding:6px 8px;cursor:pointer;white-space:nowrap;user-select:none}
td{border-bottom:1px solid var(--grid);padding:6px 8px;font-variant-numeric:tabular-nums}
tr.sel td{background:var(--chip)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--chip)}
.num{text-align:right}
.bar{height:8px;border-radius:0 4px 4px 0;background:var(--s1);display:inline-block;vertical-align:middle}
.zoomhint{font-size:12px;color:var(--muted);margin-top:6px}
.btn{font:inherit;font-size:12px;border:1px solid var(--ring);background:var(--surface);color:var(--ink2);border-radius:8px;padding:3px 9px;cursor:pointer}
a.btn{text-decoration:none;display:inline-block}
.foot{margin-top:40px;border-top:1px solid var(--grid);padding-top:14px;font-size:12px;color:var(--muted)}
.foot a{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sr{position:absolute;left:-9999px}
.halo{paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.maplab{font-weight:600;letter-spacing:.02em}
/* ---------- filters live on the chart: a panel of legend-style rows (see NOLA.stage / fsec / flist) ---------- */
/* one tab per chart (NOLA.views): the tabs in one row, the open chart below */
.vbar{display:flex;align-items:flex-start;gap:10px 18px;padding:0 0 12px;border-bottom:1px solid var(--grid);scroll-margin-top:12px}
.vtabs{display:flex;flex-wrap:wrap;gap:4px;flex:1 1 auto;min-width:0}
.vtabs button{font:inherit;font-size:13px;line-height:1.3;border:1px solid transparent;border-radius:999px;background:none;color:var(--ink2);padding:5px 12px;cursor:pointer;white-space:nowrap}
.vtabs button:hover{background:var(--chip);color:var(--ink)}
.vtabs button[aria-selected="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.vtabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vsec{margin:26px 0 0}
/* a page with one chart: its heading sits in the bar where the tabs would be */
.vbar.one{align-items:center}
.vbar.one h2{flex:0 1 auto;min-width:0;margin:0;font-family:"Young Serif",Georgia,"Times New Roman",serif;font-weight:400;font-size:21px}
.vbar.one+.vsec{margin-top:14px}
.vsec-h{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.vsec-h h2{font-size:21px;margin:0}
/* the square share button just right of the open chart's title (NOLA.views) */
.share{position:relative;flex:0 0 auto;display:inline-grid;place-items:center;width:30px;height:30px;padding:0;border-radius:8px;cursor:pointer;
  color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 32%,var(--ring));
  transition:background .15s,border-color .15s,color .15s}
.share:hover{background:color-mix(in srgb,var(--accent) 18%,var(--surface));border-color:color-mix(in srgb,var(--accent) 55%,var(--ring))}
.share:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.share.done{color:var(--surface);background:var(--accent);border-color:var(--accent)}
.share .shok{position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);white-space:nowrap;font-size:12px;color:var(--ink2);pointer-events:none}
.share .shok:empty{display:none}
@media (prefers-reduced-motion:reduce){.share{transition:none}}
@media(max-width:640px){
  .vbar{flex-direction:column;gap:10px}
  .vbar.one{flex-direction:row;flex-wrap:wrap;align-items:center}
  .vtabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px;width:calc(100% + 32px)}
  .vtabs::-webkit-scrollbar{display:none}
}
.stage{position:relative}
.stage.chartstage{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
.stage.chartstage>.fpanel{position:sticky;top:12px}
.stage.mapstage{height:clamp(460px,78vh,900px);padding:0;overflow:hidden}
.stage.mapstage .plot{position:absolute;inset:0}
.stage.mapstage .plot .map,.stage.mapstage .plot>svg{width:100%;height:100%}
.stage.mapstage .map>svg{border-radius:12px}
.stage.mapstage>.fpanel{position:absolute;top:12px;left:12px;width:296px;max-height:calc(100% - 24px);overflow:auto;overscroll-behavior:contain;
  background:var(--surface);border:1px solid var(--ring);border-radius:10px;box-shadow:0 6px 24px rgb(0 0 0 / .12);z-index:2}
.fpanel{display:flex;flex-direction:column;gap:14px;padding:14px 14px 12px;font-size:13px}
.stage.chartstage>.fpanel{padding:0}
.fpanel:empty{display:none}
.stage.chartstage>.fpanel:empty+*{grid-column:1/-1}
.eyebrow{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fsec{display:flex;flex-direction:column;gap:6px}
.fsec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.linkbtn{flex:none;white-space:nowrap;background:none;border:0;padding:2px 0;color:var(--accent);font:500 12px inherit;font-family:inherit;cursor:pointer}
.flist{display:flex;flex-direction:column;gap:1px;margin:0;padding:0;list-style:none}
.flist button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:9px;align-items:center;padding:5px 6px;border-radius:6px;cursor:pointer}
.flist button:hover{background:var(--chip)}
.flist button:focus-visible,.seg button:focus-visible,.mapctl button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.flist .sw{width:11px;height:11px;border-radius:50%}
.flist .nm{min-width:0;display:flex;flex-direction:column;gap:3px}
.flist .nm>span:first-child{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;line-height:1.3} /* long names wrap to a second line */
.flist .nm em{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flist .fb{height:3px;border-radius:2px;background:var(--grid);overflow:hidden}
.flist .fb i{display:block;height:100%}
.flist .ct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.flist.filtering button[aria-pressed="false"]{opacity:.45}
.flist button[aria-pressed="true"]{background:var(--chip);box-shadow:inset 0 0 0 1.5px var(--accent)}
.flist.toggles button[aria-pressed="false"]{opacity:.45}
.flist.toggles button[aria-pressed="false"] .sw{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--muted)}
.flist.toggles button[aria-pressed="true"]{background:none;box-shadow:none}
/* tabs at the top of a filter panel: switch one section between related charts */
.ftabs{display:flex;gap:2px;padding:3px;background:var(--chip);border-radius:9px}
.ftabs button{flex:1 1 auto;font:inherit;font-size:12.5px;line-height:1.25;border:0;border-radius:7px;background:none;color:var(--ink2);padding:6px 8px;cursor:pointer}
.ftabs.grid{display:grid;grid-template-columns:1fr 1fr}
.ftabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.ftabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:flex;border:1px solid var(--ring);border-radius:8px;overflow:hidden;width:max-content;max-width:100%}
.seg button{font:inherit;font-size:12px;border:0;background:var(--surface);color:var(--ink2);padding:5px 10px;cursor:pointer}
.seg button+button{border-left:1px solid var(--ring)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.fsel{width:100%}
.find{display:flex;gap:6px}
.find input{flex:1;min-width:0;font:inherit;font-size:13px;color:var(--ink);background:var(--chip);border:1px solid var(--ring);border-radius:7px;padding:6px 9px}
.mapctl{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--ring);border-radius:8px;overflow:hidden;z-index:2}
.mapctl button{width:34px;height:34px;border:0;background:none;color:var(--ink);padding:0;display:grid;place-items:center;cursor:pointer}
.mapctl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.mapctl button+button{border-top:1px solid var(--ring)}
.mapctl button:hover{background:var(--chip)}
.scalebar{position:absolute;right:14px;bottom:12px;font-size:11px;color:var(--ink2);display:flex;flex-direction:column;align-items:flex-end;gap:3px;pointer-events:none;z-index:2}
.scalebar i{display:block;height:5px;border:1.5px solid var(--ink2);border-top:0}
/* map options (NOLA.mapChecks): a small box of checkboxes just above the scale bar */
.mapchecks{position:absolute;right:12px;bottom:42px;z-index:2;display:flex;flex-direction:column;padding:2px;
  background:var(--surface);border:1px solid var(--ring);border-radius:8px;font-size:12px;line-height:1.3;color:var(--ink)}
.mapchecks label{display:flex;align-items:center;gap:6px;padding:3px 8px 3px 6px;border-radius:6px;cursor:pointer;user-select:none;white-space:nowrap}
.mapchecks label:hover{background:var(--chip)}
.mapchecks label.off{color:var(--muted);cursor:default}
.mapchecks label.off:hover{background:none}
.mapchecks input{margin:0;width:13px;height:13px;accent-color:var(--accent);cursor:inherit}
.mapchecks label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-1px}
.mapchecks label.sub{padding-left:20px} /* a row that belongs to the one above it (per 1k under Heatmap) */
.ftoggle{display:none}
.maphint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;opacity:0;transition:opacity .2s;
  background:rgb(11 11 11 / .78);color:#fff;font-size:13px;font-weight:500;padding:8px 14px;border-radius:999px;white-space:nowrap}
.maphint.on{opacity:1}
.stlab{font-weight:500;pointer-events:none;paint-order:stroke;stroke:var(--surface);stroke-linejoin:round}
.stlab.major{font-weight:650}
/* stepped legend for equal-count classes (NOLA.stepLegend): the value under each boundary is where that color starts */
.legend .steps{flex:1 1 100%;display:flex;max-width:290px;padding:0 22px 0 0}
.legend .steps span,.steps span{flex:1;display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:0}
.steps i{width:auto!important;height:10px;border-radius:0!important}
.steps span:first-child i{border-radius:3px 0 0 3px!important}
.steps span:last-child i{border-radius:0 3px 3px 0!important}
.steps span:only-child i{border-radius:3px!important}
.steps em{align-self:flex-start;font-style:normal;font-size:10.5px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums;transform:translateX(-50%)}
.steps span:first-child em{transform:none}
.nonekey{font-size:11.5px}
.maplegend{display:none}
.maplegend[hidden]{display:none!important}
@media(max-width:760px){
  .stage.chartstage{grid-template-columns:1fr}
  .stage.chartstage>.fpanel{position:static}
  .stage.mapstage{height:auto;overflow:visible;border:0;background:none}
  .stage.mapstage>.fpanel{position:static;width:auto;max-height:none;box-shadow:none;margin-bottom:10px}
  .stage.mapstage .plot{position:relative;height:min(560px,70vh);border:1px solid var(--ring);border-radius:12px;overflow:hidden;background:var(--surface)}
  .ftoggle{display:block;margin-bottom:8px}
  .maplegend{display:block;position:absolute;left:10px;bottom:10px;width:min(250px,calc(100% - 100px));background:var(--surface);border:1px solid var(--ring);border-radius:8px;padding:6px 8px 4px;z-index:2;font-size:11px;color:var(--ink2)}
  .maplegend .steps{display:flex;padding-right:12px}
  .maplegend .nonekey{display:flex;align-items:center;gap:5px;margin-top:3px}
  .maplegend .nonekey i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .mlh{margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mapchecks{top:162px;bottom:auto} /* phones: the map's own legend fills the bottom left, so the options sit under the map controls */
  .fpanel.collapsed{display:none}
}

/* ---------- full-screen maps (NOLA.mapButtons): the map's whole stage fills the screen, filters, legend, scale bar and
   controls included. .mapfs is on while full screen; .mapfs-css is the fallback layer where the Fullscreen API isn't
   offered (iPhone), which also locks the page's scroll (html.mapfs-lock). `html` lifts these over page-specific sizes. */
html .stage.mapstage.mapfs{position:fixed;top:0;right:0;bottom:0;left:0;z-index:1000;width:auto;height:auto;max-width:none;margin:0;
  border:0;border-radius:0;background:var(--surface);overflow:hidden}
html .stage.mapstage.mapfs .plot{position:absolute;inset:0;height:auto;border:0;border-radius:0;overflow:hidden}
html .stage.mapstage.mapfs .map>svg,html .stage.mapstage.mapfs .plot canvas{border-radius:0;touch-action:none} /* one finger moves the map */
html.mapfs-lock,html.mapfs-lock body{overflow:hidden;overscroll-behavior:none}
@media(max-width:760px){ /* phones: the Filters button and the panel float over the map */
  html .stage.mapstage.mapfs>.ftoggle{position:absolute;top:10px;left:10px;z-index:4;margin:0;padding:6px 12px;font-size:13px;color:var(--ink);box-shadow:0 2px 10px rgb(0 0 0 / .16)}
  html .stage.mapstage.mapfs>.fpanel{position:absolute;top:52px;left:10px;width:min(320px,calc(100% - 66px));max-height:calc(100% - 62px);overflow:auto;
    overscroll-behavior:contain;margin:0;z-index:3;box-shadow:0 6px 24px rgb(0 0 0 / .18)}
  html .stage.mapstage.mapfs>.fpanel.collapsed{display:none}
}

/* ---------- one page per dataset: data pages (drone, calls, trees) ---------- */
/* tables whose rows don't do anything on click */
table.static tbody tr{cursor:auto}
/* on phones a wide table scrolls inside its card instead of widening the page */
@media(max-width:760px){.stage.chartstage{grid-template-columns:minmax(0,1fr)}}

/* ---------- CPC page (cpc.js): filing-date range in the map panel, and the case-type key under the map ---------- */
.cpc-range{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cpc-range label{display:flex;flex-direction:column;gap:3px;min-width:0}
.cpc-range span{font-size:11px;color:var(--muted)}
.cpc-range input{width:100%;min-width:0;font:inherit;font-size:12.5px;color:var(--ink);background:var(--chip);border:1px solid var(--ring);border-radius:7px;padding:5px 7px}
.cpc-range input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cpc-key{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px 22px;margin-top:16px}
.cpc-kt{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.45}
.cpc-kt i{flex:0 0 11px;height:11px;border-radius:50%;margin-top:4px}
.cpc-kt b{font-weight:600}
.cpc-kt p{margin:1px 0 0;color:var(--ink2)}
@media(max-width:600px){.cpc-key{grid-template-columns:1fr;gap:10px}}
/* the map panel is wider here: it holds the agenda, which matters more than the map's width */
@media(min-width:761px){.stage.mapstage.cpc-stage>.fpanel{width:380px}}
/* meeting dates: small boxes per month, the month on its side at the left with a thin rule; groups wrap as wholes */
.cpc-days{display:flex;flex-wrap:wrap;gap:8px 14px;margin:4px 0 2px}
.cpc-days .mo{display:flex;gap:5px;max-width:100%}
.cpc-days .ml{writing-mode:vertical-rl;transform:rotate(180deg);font:600 9.5px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;padding-left:4px;border-left:1px solid var(--axis)}
.cpc-days .bx{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.cpc-days button{width:28px;height:28px;padding:0;font:500 12px/1 "IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--surface);border:1px solid var(--axis);border-radius:5px;cursor:pointer}
.cpc-days button:hover{background:var(--chip)}
.cpc-days button.none{color:var(--muted);border-color:var(--grid)}
.cpc-days button.off{box-shadow:inset 0 -2px 0 var(--s8)}
.cpc-days button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cpc-days button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- a key that isn't a filter (NOLA.kv): swatch, label, value; lines up with .flist rows ---------- */
.kvl{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink2);padding:0 6px}
.kvl span{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:9px;align-items:center}
.kvl i{width:11px;height:11px;border-radius:3px}
.kvl i.tick{width:2px;height:14px;border-radius:0;justify-self:center}
.kvl b{font:400 12px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted);font-variant-numeric:tabular-nums}
/* small yearly bars inside a map's panel (311) */
.srmini svg text{fill:var(--ink2)}

.agenda{margin:0 -4px}
.day{margin-bottom:10px}
.dh{position:sticky;top:0;background:var(--surface);font-weight:650;font-size:13px;padding:8px 0 6px;border-bottom:1px solid var(--grid)}
.ui{display:flex;gap:10px;padding:8px 6px;border-bottom:1px solid var(--grid);cursor:pointer;border-radius:6px}
.ui i{flex:0 0 10px;height:10px;border-radius:50%;margin-top:5px}
.ui.on,.ui:hover{background:var(--chip)}
.ui b{font-size:13.5px}
.ty{font-size:12px;color:var(--ink2)}
.ds{font-size:12.5px;color:var(--ink2);margin-top:2px}
.nb{font-size:11.5px;color:var(--muted);margin-top:2px}
.sms{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px 16px}
.sms.one{grid-template-columns:1fr}
.smh{font-size:13px;margin-bottom:2px}
.offday{font-weight:500;font-size:11px;color:var(--s8);margin-left:4px;white-space:nowrap}

<script>// Shared helpers for the NOLA open data pages
const NOLA = (() => {
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const S = i => `var(--s${i + 1})`;
  const fmt = d3.format(',');
  const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '—';

  // ---------- tooltip ----------
  const tipEl = document.createElement('div');
  tipEl.className = 'tip'; document.body.appendChild(tipEl);
  const tip = {
    show(html, ev) {
      tipEl.innerHTML = html; tipEl.style.opacity = 1;
      const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
      let x = ev.clientX + 14, y = ev.clientY + 14;
      if (x + w > innerWidth - 8) x = ev.clientX - w - 14;
      if (y + h > innerHeight - 8) y = ev.clientY - h - 14;
      x = Math.max(8, x); y = Math.max(8, Math.min(y, innerHeight - h - 8)); // a tall tooltip stays on screen
      tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
    },
    hide() { tipEl.style.opacity = 0; }
  };
  const row = (k, v) => `<div class="r"><span>${k}</span><span>${v}</span></div>`;

  // ---------- geography ----------
  const decode = r => { const o = []; let x = 0, y = 0; for (let i = 0; i < r.length; i += 2) { x += r[i]; y += r[i + 1]; o.push([x, y]); } return o; };
  const pathOf = rings => rings.map(r => 'M' + decode(r).map(p => p.join(',')).join('L') + 'Z').join('');
  const title = s => s.toLowerCase().replace(/(^|[\s\-\/.(&])([a-z])/g, (m, a, b) => a + b.toUpperCase()).replace(/\bMcdonogh\b/, 'McDonogh').replace(/\bB\. W\./, 'B.W.').replace(/\bSt\.\s+/g, 'St. ').replace(/\bDev\b/, 'Development');
  let GEO = null;
  // ---------- per-resident rates (2020 Census population per neighborhood, GEO.pop) ----------
  // Use only for things residents generate (e.g. calls for service), not for land- or street-based counts.
  const MIN_POP = 1000; // rates for neighborhoods smaller than this swing wildly, so they're left out
  const popOf = i => GEO.pop ? GEO.pop[i] : null;
  const perK = (n, pop) => n != null && pop >= MIN_POP ? 1000 * n / pop : null;
  const fmtRate = v => v == null ? '—' : v === 0 ? '0' : v >= 100 ? d3.format(',')(Math.round(v)) : v >= 10 ? v.toFixed(0) : v.toFixed(1);
  const POP_NOTE = '<div class="legend popnote">Per 1,000 residents (2020 Census). Visitors, workers and highway traffic also generate calls, so rates run high where few people live, like the CBD and French Quarter. Neighborhoods under 1,000 residents are left out.</div>';
  // Total / Per 1,000 residents switch
  const basisChips = (el, onSel, sel = 'n') => chips(el, [{ label: 'Total', value: 'n' }, { label: 'Per 1,000 residents', value: 'pc' }], onSel, { sel });
  // ---------- the opening view ----------
  // Every neighborhood is mapped and counted. Maps open on the populated city, leaving out the mostly
  // uninhabited marsh to the east (under 100 residents per square mile: Lake Catherine, Viavant–Venetian Isles),
  // which would otherwise shrink everything else. Zoom out or pick one from the menu to see it.
  const MIN_DENSITY = 100;
  const SQMI = 400 / 2589988; // one map unit is about 20 m
  let FULL = [-70, 130, 2110, 1730];
  const bboxOf = rings => { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; rings.forEach(r => decode(r).forEach(([x, y]) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); })); return [x0, y0, x1, y1]; };
  const pad = ([x0, y0, x1, y1], f) => { const dx = (x1 - x0) * f, dy = (y1 - y0) * f; return [x0 - dx, y0 - dy, x1 + dx, y1 + dy]; };
  function setGeo(g) {
    GEO = g;
    GEO.nb.forEach((f, i) => {
      f.idx = i; f.d = pathOf(f.r); f.name = title(f.n); f.bbox = bboxOf(f.r);
      f.sqmi = f.r.reduce((a, r) => a + Math.abs(d3.polygonArea(decode(r))), 0) * SQMI;
      f.skip = !!(g.pop && g.pop[i] / f.sqmi < MIN_DENSITY);
    });
    GEO.pd.forEach(f => { f.d = pathOf(f.r); });
    const kept = GEO.nb.filter(f => !f.skip).map(f => f.bbox);
    FULL = pad([d3.min(kept, b => b[0]), d3.min(kept, b => b[1]), d3.max(kept, b => b[2]), d3.max(kept, b => b[3])], 0.03);
  }
  const shown = i => i >= 0; // a record in neighborhood i appears on maps
  const nbList = () => GEO.nb.slice().sort((a, b) => a.name.localeCompare(b.name));
  // neighborhood picker: <select> with "All neighborhoods" (-1) and every mapped neighborhood
  function nbSelect(el, onSel, sel = -1, label = 'All neighborhoods') {
    el.innerHTML = `<option value="-1">${label}</option>` + nbList().map(f => `<option value="${f.idx}">${f.name}</option>`).join('');
    el.value = sel; el.onchange = () => onSel(+el.value);
  }

  // map(el, opts) -> {svg, layer, zoomTo, setFill, focus, k()}
  // The map fills el. It keeps clear of an on-map filter panel (o.panel) when fitting, and carries its own
  // zoom controls, scale bar and street-name labels.
  // Input: the mouse wheel (or trackpad pinch) zooms and dragging pans; the page never scrolls under the map.
  // On touch screens one finger scrolls the page and two fingers move and zoom the map (see stage()).

<script>// City Planning Commission cases page: one map (upcoming hearings / cases filed), what each case type is,
// filings per year by type, and cases per year by topic, stacked down the page
(() => {
  const P = DATA.cpc; NOLA.setGeo(DATA.geo);
  const { fmt, tip, row } = NOLA;
  const PULLED = (DATA.meta && DATA.meta.pulled) || '2026-11-18';
  const YEAR = +PULLED.slice(0, 4);
  const lastFiled = P.lastFiled || PULLED;
  // case types as colored on every chart; `about` paraphrases the City's own descriptions
  // (Comprehensive Zoning Ordinance Articles 3-4, nola.gov application pages, CPC Subdivision Regulations)
  const FOLD = [
    { n: 'Variance', t: [0], about: 'Permission to depart from a specific zoning rule, such as a setback, height or parking requirement, because of a hardship. Usually decided by the Board of Zoning Adjustments.' },
    { n: 'Minor subdivision', t: [1], about: 'Dividing or redrawing property lines to create five or fewer lots, with no new street. Most are approved by CPC staff.' },
    { n: 'Neighborhood notice (NPP)', t: [2], about: 'The notice and neighborhood meeting an applicant must hold before filing for things like a zoning change, conditional use or most variances. Nothing is decided.' },
    { n: 'Design review', t: [3], about: 'CPC staff review of a project’s site plan and building design, required for larger projects and in some districts. Includes stormwater plan reviews.' },
    { n: 'Conditional use', t: [4], about: 'A use allowed on a particular site only with City Council approval, often with conditions, after a CPC public hearing and recommendation.' },
    { n: 'Zoning, text & master plan changes', t: [5, 6, 9], about: 'Changes to a property’s zoning district, to the wording of the zoning ordinance, or to the Master Plan. The CPC recommends; the City Council decides.' },
    { n: 'Appeals, major subdivisions & other', t: [7, 8, 10], about: 'Appeals of planning and zoning decisions; subdivisions that create six or more lots or a new street, which need a CPC public hearing; and all other case types.' }];
  FOLD.forEach((f, i) => f.color = NOLA.S(i));
  const foldOf = t => FOLD.findIndex(f => f.t.includes(t));
  const TYPEIDX = Object.fromEntries(P.TYP.map((t, i) => [t, i]));
  const nbName = i => i >= 0 ? NOLA.GEO.nb[i].name : '—';
  const sw = c => `<i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${c}"></i> `;

  const startDay = new Date((P.windowStart || '2025-11-18') + 'T00:00:00Z');

  { const [v, ...kv] = location.hash.slice(1).split('&');

  if (P.ptsInfo) P.pts.forEach((p, i) => { p.info = P.ptsInfo[i]; });

  const filedTip = p => { const [addr, cnum, open] = p.info || ['', '', null];
    return `<b>${esc(addr || P.TYP[p[1]])}</b><div style="color:var(--ink2)">${addr ? P.TYP[p[1]] : ''}${addr && cnum ? ' · ' : ''}${esc(cnum)}</div>` + row('Filed', pDate(p[0]))
      + (open != null ? row('Status', open ? 'Open' : 'Closed') : '') + row('Neighborhood', nbName(p[4])) + (p[5] ? row('Topics', P.TH.filter((t, i) => (p[5] >> i) & 1).join(', ')) : ''); };

  // ---------- the map: one section, tabs at the top of its panel ----------
  let mp, ud, rg, rangeSec, nbCnt = [];
  // the filing-date inputs stay in place across redraws, so typing a date isn't interrupted
  function makeRange(panel) {
    const sec = NOLA.fsec(panel, 'Filed', ['Past 12 months', () => { st.from = DEF_FROM; st.to = LAST; V.refresh(); }]);
    const box = document.createElement('div'); box.className = 'cpc-range';
    box.innerHTML = '<label><span>From</span><input type="date" aria-label="Filed from"></label><label><span>To</span><input type="date" aria-label="Filed to"></label>';
    const [a, b] = box.querySelectorAll('input');
    [a, b].forEach(i => { i.min = isoOf(0); i.max = isoOf(LAST); i.required = true; });
    const apply = which => () => {
      const i = which ? b : a; if (!i.value) return;
      const d = clampD(dayOf(i.value));
      if (which) { st.to = d; if (st.from > d) st.from = d; } else { st.from = d; if (st.to < d) st.to = d; }
      V.refresh();
    };
    a.onchange = apply(0); b.onchange = apply(1);
    sec.appendChild(box); sec._in = [a, b];
    return sec;
  }
  function syncRange() {
    const [a, b] = rangeSec._in;
    if (document.activeElement !== a) a.value = isoOf(st.from);
    if (document.activeElement !== b) b.value = isoOf(st.to);
    rangeSec.querySelector('.linkbtn').hidden = defRange();
  }
  // what each case-type color means, right under the map and the per-year-by-type chart (the two views colored by type)
  function typeKey(pane) {
    const key = document.createElement('div'); key.className = 'cpc-key';
    key.innerHTML = FOLD.map(f => `<div class="cpc-kt"><i style="background:${f.color}"></i><div><b>${f.n}</b><p>${f.about}</p></div></div>`).join('');
    pane.after(key);
  }
  function drawMap(pane, first) {
    const { panel, plot } = staged(pane, first, true, true); // the tabs and agenda live in the panel, so phones show it open
    pane.classList.add('cpc-stage'); // a wider panel on this page (lib.css)
    const filed = st.tab === 'filed';
    pane.parentElement.querySelector('.vsec-h h2').textContent = mapTitle();
    // redrawing the panel empties it for a moment; keep the reader where they were (the panel's scroll, or the page's on phones)
    const keep = [panel.scrollTop, scrollX, scrollY];
    [...panel.children].forEach(c => { if (!(filed && c === rangeSec)) c.remove(); });
    const nbSec = nbSection(panel);
    if (filed) {
      if (!rangeSec) rangeSec = makeRange(panel);
      else if (rangeSec.parentNode !== panel) panel.appendChild(rangeSec);
      else panel.insertBefore(nbSec, rangeSec);
      syncRange();
    }
    if (first) {
      mp = NOLA.map(plot, { panel, label: 'Map of City Planning Commission cases',
        tip: i => `<b>${NOLA.GEO.nb[i].name}</b>` + row(st.tab === 'up' ? (st.day && st.day !== 'all' ? 'Cases, ' + dayFmt(st.day) : 'Upcoming hearings') : `Matching cases, ${rangeTxt()}`, fmt(nbCnt[i] || 0)) });
      rg = mp.layer.append('g'); ud = mp.layer.append('g'); mp.lastNb = -1;
      mp.onZoom(k => {
        ud.selectAll('circle').attr('r', 7 / Math.sqrt(k)).attr('stroke-width', 2 / Math.sqrt(k));
        rg.selectAll('circle').attr('r', 4 / Math.sqrt(k)).attr('stroke-width', 1 / Math.sqrt(k));
      });
      typeKey(pane);
    }
    if (mp.lastNb !== st.nb) { mp.focus(st.nb, first ? 0 : 450); mp.lastNb = st.nb; }
    ud.style('display', filed ? 'none' : null); rg.style('display', filed ? null : 'none');
    if (filed) drawFiled(panel); else drawUpcoming(panel);
    // the heatmap (a checkbox on the map): the cases shown, counted by neighborhood (every neighborhood stays shaded
    // when one is picked, for comparison)
    NOLA.heatToggle(plot, st.heat, on => set('heat', on), null);
    const cnt = d3.range(72).map(i => nbCnt[i] || 0), cl = st.heat ? NOLA.classes(cnt) : null;
    mp.setFill(cl ? i => cl.color(cnt[i]) : () => null);
    NOLA.heatKey(panel, plot, cl, filed ? 'Cases filed, by neighborhood' : 'Upcoming hearings, by neighborhood');
    NOLA.ftabs(panel, [['up', 'Upcoming hearings'], ['filed', 'Cases filed']], st.tab, v => set('tab', v));
    if (!first) { panel.scrollTop = keep[0]; if (scrollY !== keep[2]) scrollTo(keep[1], keep[2]); }
  }

  function drawUpcoming(panel) {
    const list = upF();
    nbCnt = []; upLive.filter(u => okDay(u) && okFold(u)).forEach(u => { if (u.nb >= 0) nbCnt[u.nb] = (nbCnt[u.nb] || 0) + 1; });
    typeSection(panel, FOLD.map((f, i) => upNb().filter(u => u.fold === i).length));
    const ag = NOLA.fsec(panel, `Agenda · ${fmt(list.length)} case${list.length === 1 ? '' : 's'}`, st.day && st.day !== 'all' && DAYS.length > 1 ? ['All dates', () => pickDay('all')] : null);
    datePick(ag);
    const box = document.createElement('div'); box.className = 'agenda'; ag.appendChild(box);
    box.innerHTML = list.length ? d3.groups(list, u => u.when.slice(0, 10)).map(([day, us]) => `<div class="day"><div class="dh">${dayFmt(day)} · ${[...new Set(us.map(u => u.body))].join(', ')}${offDay(day) ? ` <span class="offday" title="This is the next meeting date the City lists for these cases, but it falls on a ${offDay(day)}.">${offDay(day)}: date as listed</span>` : ''}</div>` +
      us.map(u => `<div class="ui" data-c="${u.cnum}${u.when}"><i style="background:${FOLD[u.fold].color}"></i><div><b>${u.addr}</b> <span class="ty">${u.type}</span><div class="ds">${cleanDesc(u.desc)}</div><div class="nb">${nbName(u.nb)} · ${u.cnum}</div></div></div>`).join('') + '</div>').join('')
      : `<div class="ds">No hearings${st.day && st.day !== 'all' ? ' this date' : ' scheduled'}${st.nb >= 0 ? ' in ' + nbName(st.nb) : ''}${st.fold >= 0 ? ' of this type' : ''}.</div>`;
    const upTip = d => `<b>${d.addr}</b><div style="color:var(--ink2)">${d.type} · ${d.cnum}</div>` + row('Hearing', dayFmt(d.when) + (timeFmt(d.when) ? ', ' + timeFmt(d.when) : '') + (offDay(d.when) ? ` (${offDay(d.when)}, as listed)` : '')) + row('Body', d.body) + row('Neighborhood', nbName(d.nb)) + `<div style="margin-top:6px">${cleanDesc(d.desc)}</div>`;
    const k = mp.k();
    const dots = ud.selectAll('circle').data(list.filter(u => (u.x || u.y) && NOLA.shown(u.nb)), d => d.cnum + d.when).join('circle')
      .attr('cx', d => d.x).attr('cy', d => d.y).attr('r', 7 / Math.sqrt(k)).attr('stroke-width', 2 / Math.sqrt(k))
      .attr('fill', d => FOLD[d.fold].color).attr('stroke', 'var(--surface)').attr('opacity', 1)
      .on('mousemove', (ev, d) => { tip.show(upTip(d), ev); hi(d); }).on('mouseleave', () => { tip.hide(); hi(null); });
    const items = [...box.querySelectorAll('.ui')];
    items.forEach(it => { const u = list.find(v => v.cnum + v.when === it.dataset.c); it.onmouseenter = () => hi(u); it.onmouseleave = () => hi(null); it.onclick = () => { if (u.x) mp.zoomTo([u.x - 60, u.y - 45, u.x + 60, u.y + 45], 500); }; });
    function hi(u) {
      dots.attr('opacity', d => !u || d === u ? 1 : .25);
      items.forEach(it => it.classList.toggle('on', !!u && it.dataset.c === u.cnum + u.when));
    }
  }

  // meeting dates as a row of small boxes per month, the month turned on its side at the left; one date (or all) at a time
  let refocus = false;
  const pickDay = (d, focus) => { refocus = !!focus; set('day', d); };
  function datePick(sec) {
    if (!DAYS.length) return;
    const n = d3.rollup(upLive.filter(u => (st.nb < 0 || u.nb === st.nb) && okFold(u)), v => v.length, dayOf_);
    const bodies = d3.rollup(upLive, v => [...new Set(v.map(u => u.body))].join(', '), dayOf_);
    const box = document.createElement('div'); box.className = 'cpc-days'; box.setAttribute('role', 'group'); box.setAttribute('aria-label', 'Meeting date');
    box.innerHTML = d3.groups(DAYS, d => d.slice(0, 7)).map(([m, ds]) => `<div class="mo"><span class="ml" aria-hidden="true">${new Date(m + '-15T12:00:00').toLocaleDateString('en-US', { month: 'short' })}</span><div class="bx">` +
      ds.map(d => { const c = n.get(d) || 0, off = offDay(d), lab = `${dayFmt(d)} · ${bodies.get(d)} · ${c} case${c === 1 ? '' : 's'}${off ? ` · ${off}: date as listed` : ''}`;
        return `<button type="button" data-d="${d}" class="${c ? '' : 'none'}${off ? ' off' : ''}" aria-pressed="${d === st.day}" aria-label="${lab}" title="${lab}">${+d.slice(8)}</button>`; }).join('') + '</div></div>').join('');
    const bs = [...box.querySelectorAll('button')];
    const cur = bs.find(b => b.dataset.d === st.day) || bs[0]; bs.forEach(b => b.tabIndex = b === cur ? 0 : -1);
    bs.forEach(b => b.onclick = () => { if (b.dataset.d !== st.day) pickDay(b.dataset.d, true); });
    // arrow keys move between dates (and pick them, like tabs)
    box.addEventListener('keydown', ev => {
      const i = bs.indexOf(document.activeElement); if (i < 0) return;
      const j = ev.key === 'ArrowRight' ? Math.min(bs.length - 1, i + 1) : ev.key === 'ArrowLeft' ? Math.max(0, i - 1) : ev.key === 'Home' ? 0 : ev.key === 'End' ? bs.length - 1 : -1;
      if (j < 0) return; ev.preventDefault(); if (j !== i || bs[j].dataset.d !== st.day) pickDay(bs[j].dataset.d, true);
    });
    sec.appendChild(box);
    if (refocus) { refocus = false; cur.focus({ preventScroll: true }); }
  }

  function drawFiled(panel) {
    const span = inRange(), all = matching(), pts = all.filter(okNb);
    nbCnt = []; all.forEach(p => { nbCnt[p[4]] = (nbCnt[p[4]] || 0) + 1; });
    typeSection(panel, FOLD.map((f, i) => span.filter(p => okTheme(p) && okNb(p) && foldOf(p[1]) === i).length));
    NOLA.flist(NOLA.fsec(panel, 'Topic in description', st.theme >= 0 ? ['Any topic', () => set('theme', -1)] : null),
      P.TH.map((t, i) => ({ key: i, name: t, color: 'var(--ink2)', count: span.filter(p => okType(p) && okNb(p) && (p[5] >> i) & 1).length })),
      { pressed: i => st.theme === i, onClick: toggle('theme') });
    // where the matching cases are: neighborhoods by count (ties by name, sharing a rank), the chosen one always listed
    const ranked = NOLA.nbList().map(f => [f.idx, nbCnt[f.idx] || 0]).sort((a, b) => b[1] - a[1]);
    ranked.forEach((d, r) => d.push(r && d[1] === ranked[r - 1][1] ? ranked[r - 1][2] : r + 1));
    const top = ranked.filter(d => d[1]).slice(0, 8), mine = ranked.find(d => d[0] === st.nb);
    if (mine && !top.includes(mine)) top.push(mine);
    NOLA.flist(NOLA.fsec(panel, `Most cases · ${fmt(pts.length)} shown`),
      top.map(([i, v, r]) => ({ key: i, name: `${r}. ${NOLA.GEO.nb[i].name}`, color: 'var(--s1)', count: v })), { pressed: i => st.nb === i, onClick: toggle('nb') });
    const k = mp.k();
    rg.selectAll('circle').data(pts, p => p.join()).join('circle').attr('cx', p => p[2]).attr('cy', p => p[3]).attr('r', 4 / Math.sqrt(k))
      .attr('fill', p => FOLD[foldOf(p[1])].color).attr('fill-opacity', .85).attr('stroke', 'var(--surface)').attr('stroke-width', 1 / Math.sqrt(k))
      .on('mousemove click', (ev, p) => tip.show(filedTip(p), ev)).on('mouseleave', tip.hide); // click: a tap on a phone
  }

  // ---------- filings per year ----------
  function drawYears(pane, first) {
    const { panel, plot } = staged(pane, first);
    if (first) typeKey(pane);
    const yrs = Object.keys(P.typeY).sort();
    const data = yrs.map(y => { const a = FOLD.map(() => 0); P.typeY[y].forEach((v, t) => a[foldOf(t)] += v); return { y, a }; });
    panel.innerHTML = '';
    typeSection(panel, FOLD.map((f, i) => d3.sum(data, d => d.a[i])));
    plot.innerHTML = '';
    const f = NOLA.frame(plot, { h: 380, m: { t: 10, r: 10, b: 28, l: 40 } });
    const x = d3.scaleBand().domain(yrs).range([0, f.iw]).paddingInner(.22);
    const val = d => st.fold < 0 ? d3.sum(d.a) : d.a[st.fold];
    const yy = d3.scaleLinear().domain([0, d3.max(data, val) * 1.05]).range([f.ih, 0]).nice();
    NOLA.yGrid(f, yy, 5, d3.format('d'));
    // the current year is drawn lighter, with a "to date" label, until it's over
    const partial = d => +d.y === YEAR && !lastFiled.endsWith('-12-31');
    data.forEach(d => { let y0 = 0; d.a.forEach((v, i) => { if (!v || (st.fold >= 0 && i !== st.fold)) return; f.g.append('rect').attr('x', x(d.y)).attr('width', x.bandwidth()).attr('y', yy(y0 + v) + 1).attr('height', Math.max(.5, yy(y0) - yy(y0 + v) - 1)).attr('fill', FOLD[i].color).attr('rx', 1.5).attr('opacity', partial(d) ? .45 : 1); y0 += v; }); });
    data.filter(partial).forEach(d => f.g.append('text').attr('class', 'halo').attr('x', x(d.y) + x.bandwidth()).attr('y', yy(val(d)) - 5).attr('text-anchor', 'end').style('fill', 'var(--ink2)').text('to ' + NOLA.isoDate(lastFiled).replace(/, \d+$/, '')));
    f.g.selectAll('rect.h').data(data).join('rect').attr('class', 'h').attr('x', d => x(d.y) - 2).attr('width', x.step()).attr('height', f.ih).attr('fill', 'transparent')
      .on('mousemove', (ev, d) => tip.show(`<b>${d.y}${+d.y === YEAR ? ` (through ${NOLA.isoDate(lastFiled).replace(/, \d+$/, '')})` : ''}</b>` + row('Total', fmt(d3.sum(d.a))) + FOLD.map((fo, i) => d.a[i] ? row(sw(fo.color) + fo.n, d.a[i]) : '').join(''), ev)).on('mouseleave', tip.hide);
    f.g.selectAll('text.x').data(yrs.filter((y, i) => i % (f.iw < 500 ? 4 : 2) === 0)).join('text').attr('class', 'x').attr('x', y => x(y) + x.bandwidth() / 2).attr('y', f.ih + 18).attr('text-anchor', 'middle').text(y => "'" + y.slice(2));
    f.g.append('line').attr('x1', 0).attr('x2', f.iw).attr('y1', f.ih).attr('y2', f.ih).attr('stroke', 'var(--axis)');
  }

  // ---------- topics per year: all side by side, or one picked in the panel ----------
  function drawTopics(pane, first) {
    const { panel, plot } = staged(pane, first);
    const yrs = Object.keys(P.themeY).sort().filter(y => +y >= 2010);
    panel.innerHTML = '';
    NOLA.flist(NOLA.fsec(panel, `Topic · cases since ${yrs[0]}`, st.theme >= 0 ? ['Show all', () => set('theme', -1)] : null),
      P.TH.map((t, i) => ({ key: i, name: t, color: 'var(--s1)', count: d3.sum(yrs, y => P.themeY[y][i]) })), { pressed: i => st.theme === i, onClick: toggle('theme') });
    plot.innerHTML = '<div class="sms"></div>';
    const host = plot.firstChild, one = st.theme >= 0;
    host.classList.toggle('one', one);
    const yMax = d3.max(one ? [st.theme] : P.TH.map((t, i) => i), i => d3.max(yrs, y => P.themeY[y][i])) * 1.05;
    P.TH.forEach((t, i) => {
      if (one && i !== st.theme) return;
      const box = document.createElement('div'); box.className = 'sm'; host.appendChild(box);
      box.innerHTML = `<div class="smh"><b>${t}</b></div>`;
      const vals = yrs.map(y => P.themeY[y][i]);
      const f = NOLA.frame(box, { h: one ? 340 : 100, m: { t: 6, r: 4, b: 18, l: one ? 34 : 4 } });
      const x = d3.scaleBand().domain(yrs).range([0, f.iw]).paddingInner(.2);
      const y = d3.scaleLinear().domain([0, yMax]).range([f.ih, 0]).nice();
      if (one) NOLA.yGrid(f, y, 4, d3.format('d'));
      f.g.selectAll('rect.b').data(vals).join('rect').attr('class', 'b').attr('x', (v, j) => x(yrs[j])).attr('width', x.bandwidth()).attr('y', v => y(v)).attr('height', v => f.ih - y(v)).attr('rx', 1.5).attr('fill', 'var(--s1)')
        .attr('opacity', (v, j) => +yrs[j] === YEAR && !lastFiled.endsWith('-12-31') ? .45 : 1); // current year so far
      f.g.selectAll('rect.h').data(yrs).join('rect').attr('class', 'h').attr('x', yy => x(yy) - 1).attr('width', x.step()).attr('height', f.ih).attr('fill', 'transparent')
        .on('mousemove', (ev, yy) => tip.show(`<b>${t}, ${yy}${+yy === YEAR ? ` (through ${NOLA.isoDate(lastFiled).replace(/, \d+$/, '')})` : ''}</b>` + row('Cases', P.themeY[yy][i]), ev)).on('mouseleave', tip.hide);
      f.g.append('line').attr('x1', 0).attr('x2', f.iw).attr('y1', f.ih).attr('y2', f.ih).attr('stroke', 'var(--axis)');
      if (one) f.g.selectAll('text.x').data(yrs.filter((yy, j) => j % 2 === 0)).join('text').attr('class', 'x').attr('x', yy => x(yy) + x.bandwidth() / 2).attr('y', f.ih + 14).attr('text-anchor', 'middle').text(yy => "'" + yy.slice(2));
      else { f.g.append('text').attr('x', 0).attr('y', f.ih + 13).text("'" + yrs[0].slice(2)); f.g.append('text').attr('x', f.iw).attr('y', f.ih + 13).attr('text-anchor', 'end').text("'" + yrs[yrs.length - 1].slice(2)); }
    });
  }

  const V = NOLA.views([
    { id: 'map', label: mapTitle(), tab: 'Map of cases', keep: true, draw: drawMap },
    { id: 'years', label: 'Cases filed per year, by type', draw: drawYears },
    { id: 'topics', label: 'Cases per year mentioning each topic', draw: drawTopics },
  ], { ds: ['xxb5-5azv', 'CPC Projects'],
       state: () => ({ tab: st.tab === 'filed' ? 'filed' : null, date: st.day !== NEXT ? st.day : null, from: st.from !== DEF_FROM ? isoOf(st.from) : null, to: st.to !== LAST ? isoOf(st.to) : null,
         fold: st.fold >= 0 ? st.fold : null, theme: st.theme >= 0 ? st.theme : null, nb: st.nb >= 0 ? st.nb : null, heat: st.heat ? 1 : null }) });
})();
</script>
</body></html>
